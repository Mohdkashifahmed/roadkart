<section id="cart">
  <h2>Cart</h2>

  <ul>
    @if (shop.cart.length === 0) {
      <li>Your cart is empty.</li>
    }
    @for (item of shop.cart; track $index) {
      <li class="d-flex justify-content-between align-items-center">
        {{ item.name }} ({{ item.seller }}) - ₹{{ item.price }}
        <button type="button" (click)="shop.removeFromCart($index)">Remove</button>
      </li>
    }
  </ul>

  <p>Total: ₹<output id="cartTotal">{{ shop.getTotal() }}</output></p>
  <button type="button" id="checkoutBtn" routerLink="/checkout">Checkout</button>
</section>
